<script>
    document.addEventListener('DOMContentLoaded', () => {
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    const submenuParents = document.querySelectorAll('#nav-links li > .submenu');

    // Burger toggle
    menuToggle.addEventListener('click', () => {
        navLinks.classList.toggle('active');
    });

    // Mobile submenu toggle
    document.querySelectorAll('#nav-links > li').forEach(li => {
        li.addEventListener('click', e => {
            if(window.innerWidth <= 720){
                const submenu = li.querySelector('.submenu');
                if(submenu){
                    li.classList.toggle('active');
                    e.stopPropagation();
                }
            }
        });
    });

    // Keep dropdown in view for user menu
    const userMenu = document.querySelector('.user-menu');
    const dropdown = userMenu.querySelector('.dropdown');

    userMenu.addEventListener('mouseenter', () => {
        const menuRect = userMenu.getBoundingClientRect();
        const dropdownRect = dropdown.getBoundingClientRect();

        if(menuRect.right + dropdownRect.width > window.innerWidth){
            dropdown.style.left = 'auto';
            dropdown.style.right = '0';
        } else {
            dropdown.style.left = '0';
            dropdown.style.right = 'auto';
        }
        dropdown.style.opacity = '1';
        dropdown.style.visibility = 'visible';
        dropdown.style.transform = 'translateY(0)';
    });

    userMenu.addEventListener('mouseleave', () => {
        dropdown.style.opacity = '0';
        dropdown.style.visibility = 'hidden';
        dropdown.style.transform = 'translateY(8px)';
    });
});

</script>
